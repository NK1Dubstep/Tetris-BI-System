<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Tetris BI - CCU Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <h1>Tetris BI - CCU Dashboard</h1>
  <div id="stats">
    <p>Total points: <span id="total_points">0</span></p>
    <p>Last CCU: <span id="last_ccu">0</span></p>
  </div>
  <canvas id="ccuChart" width="800" height="400"></canvas>

  <script>
    let chart;

    async function fetchData() {
      try {
        const response = await fetch('/tetris_bi/get_ccu_data?limit=100');
        const data = await response.json();

        document.getElementById('total_points').textContent = data.total_points;
        if (data.ys.length > 0) {
          document.getElementById('last_ccu').textContent = data.ys[data.ys.length - 1];
        }

        if (chart) {
          chart.data.labels = data.xs;
          chart.data.datasets[0].data = data.ys;
          chart.update();
        } else {
          const ctx = document.getElementById('ccuChart').getContext('2d');
          chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: data.xs,
              datasets: [{
                label: 'CCU (Concurrent Users)',
                data: data.ys,
                borderColor: 'rgb(75, 192, 192)',
                backgroundColor: 'rgba(75, 192, 192, 0.1)',
                tension: 0.1,
                fill: true
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: {
                legend: {
                  position: 'top',
                },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      return `CCU: ${context.raw}`;
                    }
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  title: {
                    display: true,
                    text: 'Concurrent Users'
                  }
                },
                x: {
                  title: {
                    display: true,
                    text: 'Time'
                  },
                  ticks: {
                    maxRotation: 45,
                    minRotation: 45
                  }
                }
              }
            }
          });
        }
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
